<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Le Mie Spese">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Le Mie Spese</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#fff;margin:0 auto;padding:20px 16px 60px;max-width:740px}h1{color:#61dca5;font-size:26px}h2{font-size:19px}.card{background:#26364a;border-radius:16px;padding:18px;margin:16px 0}.muted{color:#c0cede;font-size:14px}.total{font-size:34px;font-weight:750;margin:10px 0}input,select,button{font:inherit;border:0;border-radius:9px;padding:12px}input,select{display:block;width:100%;margin:6px 0 13px;background:#fff;color:#101827;color-scheme:light}button{background:#49c991;color:#101827;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9f7d3}.wide{width:100%}.secondary{background:#435a75;color:white}.danger{background:#a63c51;color:white}.hidden,[hidden]{display:none!important}.top{display:flex;align-items:center;gap:14px}.top h1{margin:8px 0}.dots{background:#26364a;color:white;font-size:27px;line-height:1;width:48px;height:48px;padding:0}.overlay{position:fixed;inset:0;background:#0009;z-index:10}.menu{position:fixed;top:75px;left:16px;z-index:11;width:min(310px,calc(100vw - 32px));background:#26364a;padding:18px;border-radius:16px;box-shadow:0 12px 30px #0008}.menu button{display:block;width:100%;margin-top:10px;text-align:left}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.nav h2{text-align:center}.expense{padding:14px 0;border-bottom:1px solid #435a75}.expense:last-child{border:0}.expense-head{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;margin-top:10px}.tag{color:#a9f7d3;font-size:13px;margin:5px 0}.history-button{display:flex;justify-content:space-between;gap:8px;width:100%;margin:8px 0;text-align:left}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}.legend-label{display:flex;align-items:center;gap:9px}.swatch{width:13px;height:13px;border-radius:4px;display:inline-block;flex-shrink:0}.pie{display:block;width:min(270px,100%);aspect-ratio:1;margin:14px auto;border-radius:50%;background:#435a75}.hint{font-size:13px;color:#c0cede}
</style>
</head>
<body>
<header class="top"><button id="menu-button" class="dots" type="button" aria-label="Apri impostazioni" aria-expanded="false">&#8942;</button><h1>Le Mie Spese</h1></header>
<p id="today" class="muted"></p>
<div id="overlay" class="overlay" hidden></div>
<aside id="menu" class="menu" hidden><h2>Impostazioni</h2><button id="export" type="button">↓ Esporta backup</button><button id="import-button" class="secondary" type="button">↑ Importa backup</button><input id="import-file" type="file" accept=".json,application/json" hidden><p class="hint">Conserva una copia su iCloud Drive. Importare un backup sostituisce tutte le spese attuali.</p><button id="close-menu" class="secondary" type="button">Chiudi</button></aside>
<section class="card"><div class="muted">Totale del mese</div><div id="total" class="total">€ 0,00</div><div id="count" class="muted"></div></section>
<nav class="nav"><button id="prev" class="secondary" type="button" aria-label="Mese precedente">❮</button><h2 id="month"></h2><button id="next" class="secondary" type="button" aria-label="Mese successivo">❯</button></nav>
<section class="card"><h2 id="form-title">Aggiungi una spesa</h2><form id="expense-form"><label for="name">Descrizione</label><input id="name" maxlength="120" required placeholder="Es. Supermercato"><label for="amount">Importo (€)</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="Es. 25.50"><label for="category">Categoria</label><select id="category"></select><label for="date">Data della spesa</label><input id="date" type="date" required><button id="submit" class="wide" type="submit">Salva spesa</button><button id="cancel" class="wide secondary hidden" type="button" style="margin-top:8px">Annulla modifica</button></form></section>
<section class="card"><h2>Spese del mese</h2><div id="expenses"></div></section>
<section class="card"><h2>Spese per categoria</h2><div id="pie" class="pie" role="img" aria-label="Grafico a torta delle spese per categoria" hidden></div><div id="legend"></div></section>
<section class="card"><h2>Riepilogo dei mesi</h2><div id="history"></div></section>
<script>
'use strict';
const KEY='spese';
const CATS=['Alimentari','Trasporti','Ristoranti','Shopping','Casa','Salute','Svago','Altro'];
const COLORS=['#49c991','#5b9df9','#ffb454','#e879a8','#a78bfa','#f87171','#22d3ee','#facc15'];
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uuid=()=>crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;}
function validExpense(s){return s&&typeof s.nome==='string'&&s.nome.trim().length>0&&s.nome.length<=120&&typeof s.importo==='number'&&Number.isFinite(s.importo)&&s.importo>0&&validDate(s.data);}
function normalize(s){return {id:typeof s.id==='string'&&s.id?s.id:uuid(),nome:s.nome,importo:s.importo,data:s.data,categoria:typeof s.categoria==='string'&&s.categoria?s.categoria:'Altro'};}
let expenses=[];let loadOK=true;
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data)||!data.every(validExpense))throw Error('Dati locali non validi');expenses=data.map(normalize);}catch(e){loadOK=false;alert('Impossibile leggere le spese già salvate. Non aggiungere spese prima di aver recuperato i dati.');}
let view=new Date();view.setDate(1);let editing=null;
function persist(){if(!loadOK){alert('Salvataggio bloccato per proteggere i dati esistenti.');return false;}try{localStorage.setItem(KEY,JSON.stringify(expenses));return true;}catch(e){alert('Impossibile salvare. Controlla le impostazioni o lo spazio disponibile.');return false;}}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function resetForm(){editing=null;$('expense-form').reset();$('date').value=localDate(new Date());$('form-title').textContent='Aggiungi una spesa';$('submit').textContent='Salva spesa';$('cancel').classList.add('hidden');}
function menuOpen(open){$('menu').hidden=!open;$('overlay').hidden=!open;$('menu-button').setAttribute('aria-expanded',String(open));}
$('menu-button').onclick=()=>menuOpen($('menu').hidden);$('overlay').onclick=()=>menuOpen(false);$('close-menu').onclick=()=>menuOpen(false);
function renderPie(current){const sums=new Map();for(const s of current){const cat=s.categoria||'Altro';sums.set(cat,(sums.get(cat)||0)+s.importo);}const data=[...sums].sort((a,b)=>b[1]-a[1]);const pie=$('pie'),legend=$('legend');legend.replaceChildren();if(!data.length){pie.hidden=true;legend.append(el('p','Nessuna spesa in questo mese.','muted'));return;}pie.hidden=false;const total=data.reduce((sum,[,n])=>sum+n,0);let pct=0;const stops=[];data.forEach(([cat,n],i)=>{const next=pct+n/total*100;const color=COLORS[i%COLORS.length];stops.push(`${color} ${pct}% ${next}%`);pct=next;const row=el('div',undefined,'legend-row'),label=el('span',undefined,'legend-label'),swatch=el('span',undefined,'swatch');swatch.style.background=color;label.append(swatch,el('span',cat));row.append(label,el('strong',`${money(n)} · ${(n/total*100).toFixed(1)}%`));legend.append(row);});pie.style.background=`conic-gradient(${stops.join(',')})`;pie.setAttribute('aria-label',data.map(([cat,n])=>`${cat}: ${money(n)}`).join('; '));}
function render(){const key=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`;$('month').textContent=new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(view);const current=expenses.filter(s=>s.data.slice(0,7)===key).sort((a,b)=>b.data.localeCompare(a.data));const total=current.reduce((n,s)=>n+s.importo,0);$('total').textContent=money(total);$('count').textContent=`${current.length} spese registrate`;
const list=$('expenses');list.replaceChildren();if(!current.length)list.append(el('p','Nessuna spesa in questo mese.','muted'));
for(const s of current){const item=el('div',undefined,'expense'),head=el('div',undefined,'expense-head'),info=el('div');const dateText=new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(s.data+'T12:00:00'));info.append(el('strong',s.nome),el('div',s.categoria,'tag'),el('div',dateText,'muted'));head.append(info,el('strong',money(s.importo)));const actions=el('div',undefined,'actions'),edit=el('button','Modifica','secondary'),del=el('button','Elimina','danger');edit.onclick=()=>{editing=s.id;$('name').value=s.nome;$('amount').value=s.importo;if(![...$('category').options].some(o=>o.value===s.categoria))$('category').append(new Option(s.categoria,s.categoria));$('category').value=s.categoria;$('date').value=s.data;$('form-title').textContent='Modifica spesa';$('submit').textContent='Salva modifiche';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});};del.onclick=()=>{if(!confirm(`Eliminare la spesa "${s.nome}"?`))return;const old=expenses;expenses=expenses.filter(x=>x.id!==s.id);if(!persist()){expenses=old;return;}if(editing===s.id)resetForm();render();};actions.append(edit,del);item.append(head,actions);list.append(item);}
renderPie(current);const months=new Map();for(const s of expenses){const k=s.data.slice(0,7);months.set(k,(months.get(k)||0)+s.importo);}const history=$('history');history.replaceChildren();if(!months.size)history.append(el('p','Nessuna spesa registrata.','muted'));for(const [k,n] of [...months].sort((a,b)=>b[0].localeCompare(a[0]))){const [y,m]=k.split('-').map(Number);const b=el('button',undefined,'secondary history-button');b.append(el('span',new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))),el('strong',money(n)));b.onclick=()=>{view=new Date(y,m-1,1);render();window.scrollTo({top:0,behavior:'smooth'});};history.append(b);}}
$('today').textContent='Oggi: '+new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
for(const c of CATS)$('category').append(new Option(c,c));for(const c of new Set(expenses.map(s=>s.categoria)))if(![...$('category').options].some(o=>o.value===c))$('category').append(new Option(c,c));
$('expense-form').onsubmit=e=>{e.preventDefault();const nome=$('name').value.trim(),importo=Number($('amount').value),data=$('date').value,categoria=$('category').value;if(!nome||!Number.isFinite(importo)||importo<=0||!validDate(data)){alert('Controlla descrizione, importo e data.');return;}const before=expenses.map(s=>({...s}));if(editing){const s=expenses.find(s=>s.id===editing);if(!s)return;Object.assign(s,{nome,importo,data,categoria});}else expenses.push({id:uuid(),nome,importo,data,categoria});if(!persist()){expenses=before;return;}const [y,m]=data.split('-').map(Number);view=new Date(y,m-1,1);resetForm();render();};
$('cancel').onclick=resetForm;$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
$('export').onclick=()=>{const backup={app:'Le Mie Spese',version:3,exportedAt:new Date().toISOString(),spese:expenses};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`le-mie-spese-backup-${localDate(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);menuOpen(false);};
$('import-button').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('File troppo grande');const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.spese)||!(data.app==='Le Mie Spese'||data.applicazione==='Le Mie Spese')||!data.spese.every(validExpense))throw Error('File di backup non valido');const ids=new Set();const imported=data.spese.map(s=>{const n=normalize(s);if(ids.has(n.id))n.id=uuid();ids.add(n.id);return n;});if(!confirm(`Importare ${imported.length} spese? Le ${expenses.length} spese attuali saranno SOSTITUITE. Continuare?`))return;const old=expenses;const oldOK=loadOK;expenses=imported;loadOK=true;if(!persist()){expenses=old;loadOK=oldOK;return;}for(const c of new Set(expenses.map(s=>s.categoria)))if(![...$('category').options].some(o=>o.value===c))$('category').append(new Option(c,c));resetForm();render();alert('Backup importato correttamente.');}catch(err){alert('Importazione non riuscita: '+err.message);}finally{e.target.value='';menuOpen(false);}};
resetForm();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
